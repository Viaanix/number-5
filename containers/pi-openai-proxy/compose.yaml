name: j5-pi-openai-proxy

services:
  proxy:
    # The tag is the single source for the published image: .github/workflows/proxy-image.yml
    # reads it from here. Bump the last number when the Dockerfile, package.json or bun.lock
    # change; CI refuses to overwrite a tag that is already published, so a machine can never
    # keep running an older build under the same tag. 4.9.6 is the version of the fork build in
    # package.json (vx-daniel/pi-openai-proxy), not upstream's unpublished 4.9.6.
    image: ghcr.io/viaanix/j5-pi-openai-proxy:4.9.6-1
    build:
      context: .
    init: true
    environment:
      PI_PROXY_AUTH_TOKEN: "${PI_PROXY_AUTH_TOKEN:?Export a local proxy bearer token first}"
    ports:
      - "127.0.0.1:${PI_PROXY_PORT:-4141}:4141"
    volumes:
      - pi-auth:/home/bun/.pi/agent
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const response = await fetch('http://127.0.0.1:4141/v1/models', { headers: { Authorization: 'Bearer ' + process.env.PI_PROXY_AUTH_TOKEN } }); if (!response.ok) process.exit(1);"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  pi-auth:
