# Native issue triage; the launcher supplies the requested issue in workflow.yaml.
# The proxy must already be running, with PI_PROXY_AUTH_TOKEN exported by the caller.
#
# One agent reads an issue and the code it concerns (read-only: no shell, no write tools) and
# records a verdict through triage_apply, the only tool that writes to GitHub. What that tool may
# do is fixed in code (helpers/triage-plan.ts): four j5/ labels, one comment, and for a split two
# to eight sub-issues. The issue text is written by other people, so nothing here relies on the
# agent staying on task for those limits to hold.
providers:
  pi:
    base_url: http://127.0.0.1:4141/v1
    api_type: openai_chatcompletions
    token_key: PI_PROXY_AUTH_TOKEN

models:
  triager_model:
    provider: pi
    model: claude-sonnet-5-5
    max_tokens: 16384
    # Docker Agent maps thinking_budget only for recognized OpenAI reasoning models.
    # The proxy accepts this explicit effort field for Claude's adaptive thinking.
    provider_opts:
      extra_body:
        reasoning_effort: high

agents:
  triager:
    model: triager_model
    description: Decides whether a GitHub issue can be worked on as written, and labels it, asks for what is missing, or splits it into sub-issues
    instruction_file:
      - instructions/j5-craft.md
      - instructions/triager.md
    # The checkout is the repository's own code, so its conventions are useful context. The issue
    # text is the untrusted part, and triage_context fences it.
    add_prompt_files: [AGENTS.md, CLAUDE.md]
    add_environment_info: true
    max_iterations: 60
    toolsets:
      - type: filesystem
        allow_list: ["."]
        tools: [read_file, read_multiple_files, list_directory, directory_tree, search_files_content]
      - type: git
      - type: script
        shell:
          triage_context:
            cmd: triage-context
            description: Reads the issue and the checkout. Returns the issue's state, author, labels, earlier triage, parent and sub-issues, the commit you are reading, and the issue's title, body and comments inside UNTRUSTED markers. Call it first, once
            args:
              issue:
                type: integer
                description: Positive issue number requested by the user
            required: [issue]
          triage_apply:
            cmd: triage-apply
            description: Records your verdict on the issue. Adds the verdict's j5/ label (and removes any other j5/ verdict label), posts your comment, and for a split creates the sub-issues and links them. Call it once, after you have read the code. It refuses pull requests, closed issues, and a second split
            args:
              issue:
                type: integer
                description: Positive issue number requested by the user
              verdict:
                type: string
                description: Exactly one of ready, needs-info, needs-decision, split
              comment:
                type: string
                description: The complete triage comment, as it should appear on the issue, without a footer (one is added)
              children:
                type: string
                description: 'Only for split. A JSON array of 2 to 8 objects {"title": "...", "body": "..."}, one per sub-issue, in the order they should be done'
            required: [issue, verdict, comment]

# The read-only tools need no confirmation prompt. triage_apply is on the list because it is the
# whole point of the team and an unattended queue run has nobody to confirm it; its limits live in
# the helper, not here. Name tools rather than using --safety autonomous: a tool added later
# still asks.
permissions:
  allow:
    - read_file
    - read_multiple_files
    - list_directory
    - directory_tree
    - search_files_content
    - git_status
    - git_log
    - git_branches
    - git_show
    - git_blame
    - triage_context
    - triage_apply

# Launch options, chosen with `j5 triage ... --model <tier> --effort <level>`: standard
# flavors defined once in workflows/flavors.yaml and written into the block below by
# `bun run flavors`. `flavors.models` in workflow.yaml lists the models they change. No flavor =
# the file as written.
# BEGIN GENERATED FLAVORS: written by `bun run flavors` from workflows/flavors.yaml and the
# `flavors:` block of workflow.yaml. Edit those, not this block.
flavors:
  model-haiku:
    models:
      triager_model:
        model: claude-haiku-5-5
  model-sonnet:
    models:
      triager_model:
        model: claude-sonnet-5-5
  model-opus:
    models:
      triager_model:
        model: claude-opus-5-5
  model-fable:
    models:
      triager_model:
        model: claude-fable-5-1
  effort-low:
    models:
      triager_model:
        provider_opts:
          extra_body:
            reasoning_effort: low
  effort-medium:
    models:
      triager_model:
        provider_opts:
          extra_body:
            reasoning_effort: medium
  effort-high:
    models:
      triager_model:
        provider_opts:
          extra_body:
            reasoning_effort: high
  effort-xhigh:
    models:
      triager_model:
        provider_opts:
          extra_body:
            reasoning_effort: xhigh
# END GENERATED FLAVORS
