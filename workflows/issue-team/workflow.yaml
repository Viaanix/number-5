# Launcher manifest for the issue team: how `j5` starts it. docker-agent never reads
# this file. Schema and rules: launcher/src/manifest.ts and docs/launcher.md.
#
# The agent is a native docker-agent agent (team.yaml): it loads its procedure from an
# instruction_file in instructions/, so the `message` is only the task. In a message,
# `{name}` is a parameter and `{{` / `}}` are literal braces.
name: issue-team
description: GitHub issue → pull request (a draft when the review or verification does not pass)
team: team.yaml
# The typed tools in team.yaml call these helpers by name.
path: [bin]
# The reviewer must not be the same model class as the agents whose work it reviews. j5 picks
# its tier from theirs, one step up (down from the top tier), with a reviewer-on-<tier> flavor
# from team.yaml, and refuses to launch if it cannot. Rule: launcher/src/independence.ts.
independence:
  reviewer: reviewer
  reviews: [builder, tester]

entrypoints:
  work-issue:
    description: Take an issue to a pull request, in a fresh worktree from the base branch
    agent: root
    parameters:
      issue: { type: integer, label: Issue number }
    worktree:
      mode: new
      # The repository name keeps the same issue number in two repositories apart.
      name: "{repo}-issue-{issue}"
    # `j5 issue-team work-issue --queue 474,480 --max-rounds 5` (or --queue-label) runs
    # this entry point once per issue, unattended; the preamble goes before the message.
    queue:
      parameter: issue
      preamble: |
        UNATTENDED QUEUE RUN — issue {issue}, item {position} of {count}. Read this first; it overrides the procedure in your instructions where they differ.

        - Nobody is watching and nobody will answer. Wherever the procedure says to ask the user because the issue is ambiguous or leaves a choice open, do not ask: decide. Pick the option you would recommend, build and test it like any other change, and explain it in the PR body under "Why": a "Decisions" list with each choice, the alternatives you considered, and why you chose as you did. The user's review of the PR is the check on your decision.
        - Stop instead, and report why in the RESULT line, only when the decision needs a change in another repository, would have an effect that not merging the PR cannot undo (a data migration, an external system, a message sent), or when you cannot tell how to run the tests. If the option you would pick changes nothing in this repository (the issue only needs an answer), do not invent a change: stop, and put your answer in the RESULT line. Nothing was committed, so there is no PR.
        - Fix rounds: {round_limit}, which replaces the procedure's own limit. Whatever the limit, stop fixing as soon as a round changes nothing: the same reviewer blocker, or the same failing test, twice in a row.
        - Keep going until the tests pass and the reviewer approves, then publish as step 10 says. When you reach the round limit, or a round changes nothing, publish a draft PR as step 9 says instead of stopping.
        - The very last line of your final message must be exactly one of these, alone on its line:
          RESULT: PR <the pull request URL>
          RESULT: FAILED <one line: what stopped you>
          For a draft PR, use the FAILED form and put the draft's URL first: RESULT: FAILED draft PR <the pull request URL>: <what stopped you>
          Do not write a RESULT line anywhere else.
    message: |
      Work issue #{issue}.
