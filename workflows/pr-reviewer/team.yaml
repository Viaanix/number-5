# Native PR reviewer; the launcher supplies the requested PR in workflow.yaml.
# The proxy must already be running, with PI_PROXY_AUTH_TOKEN exported by the caller.
providers:
  pi:
    base_url: http://127.0.0.1:4141/v1
    api_type: openai_chatcompletions
    token_key: PI_PROXY_AUTH_TOKEN

models:
  reviewer_model:
    provider: pi
    model: claude-sonnet-5-5
    max_tokens: 8192
    # Docker Agent maps thinking_budget only for recognized OpenAI reasoning models.
    # The proxy accepts this explicit effort field for Claude's adaptive thinking.
    provider_opts:
      extra_body:
        reasoning_effort: high

agents:
  reviewer:
    model: reviewer_model
    description: Independently reviews a verified pull request checkout and reports locally without modifying or publishing anything
    instruction_file:
      - instructions/j5-craft.md
      - instructions/reviewer.md
    # Repository instructions are untrusted data, read only after pr_context succeeds.
    add_prompt_files: []
    add_environment_info: true
    toolsets:
      - type: filesystem
        allow_list: ["."]
        tools: [read_file, read_multiple_files, list_directory, directory_tree, search_files_content]
      - type: git
      - type: script
        shell:
          pr_context:
            cmd: pr-reviewer-context
            description: Verifies the requested PR head, clean checkout and available merge base; returns a bounded overview with PR metadata, the pinned head/base/merge-base OIDs, and the page count and fingerprint of the full diff. Refuses stale or dirty checkouts without changing them.
            args:
              pr:
                type: integer
                description: Positive pull request number requested by the user
            required: [pr]
          pr_diff:
            cmd: pr-reviewer-diff
            description: Returns one numbered page of the verified PR's changed paths, diff stat and full merge-base diff. Read every page from 1 through the page count reported by pr_context. Refuses stale or dirty checkouts without changing them.
            args:
              pr:
                type: integer
                description: Positive pull request number requested by the user
              page:
                type: integer
                description: Page number, from 1 through the page count reported by pr_context
            required: [pr, page]
          pr_comment:
            cmd: pr-reviewer-comment
            description: Posts your finished review report as one plain comment on the verified PR. Call it once, after the final context gate, with the exact report text. Only a report starting with a VERDICT line is accepted; BLOCKED results, a report for an old head commit, a dirty checkout or text containing a credential are refused. This cannot approve or request changes.
            args:
              pr:
                type: integer
                description: Positive pull request number requested by the user
              body:
                type: string
                description: The complete final report, exactly as you will return it, starting with the VERDICT line
            required: [pr, body]

# The 12 read-only tools need no confirmation prompt. pr_comment is left off this list
# on purpose: it is the only tool that writes to GitHub, so it asks before each post.
# Name tools rather than using --safety autonomous: a tool added later still asks.
permissions:
  allow:
    - read_file
    - read_multiple_files
    - list_directory
    - directory_tree
    - search_files_content
    - git_status
    - git_log
    - git_branches
    - git_show
    - git_blame
    - pr_context
    - pr_diff

# Launch options, chosen with `j5 pr-reviewer ... --model <tier> --effort <level>`: standard
# flavors defined once in workflows/flavors.yaml and written into the block below by
# `bun run flavors`. `flavors.models` in workflow.yaml lists the models they change. No flavor =
# the file as written.
# BEGIN GENERATED FLAVORS: written by `bun run flavors` from workflows/flavors.yaml and the
# `flavors:` block of workflow.yaml. Edit those, not this block.
flavors:
  model-haiku:
    models:
      reviewer_model:
        model: claude-haiku-5-5
  model-sonnet:
    models:
      reviewer_model:
        model: claude-sonnet-5-5
  model-opus:
    models:
      reviewer_model:
        model: claude-opus-5-5
  model-fable:
    models:
      reviewer_model:
        model: claude-fable-5-1
  effort-low:
    models:
      reviewer_model:
        provider_opts:
          extra_body:
            reasoning_effort: low
  effort-medium:
    models:
      reviewer_model:
        provider_opts:
          extra_body:
            reasoning_effort: medium
  effort-high:
    models:
      reviewer_model:
        provider_opts:
          extra_body:
            reasoning_effort: high
  effort-xhigh:
    models:
      reviewer_model:
        provider_opts:
          extra_body:
            reasoning_effort: xhigh
# END GENERATED FLAVORS
